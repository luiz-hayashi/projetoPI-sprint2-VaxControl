    <h1>VaxControl</h1>

    <h2>Dados Financeiros</h2>

    <label for="ipt_camara">Insira quantidade de lotes mantidos por câmara:</label>

    <h2>Dados de Estrutura</h2>

    <label for="ipt_litros">Insira quantidade de litros por câmara em m³:</label>
    <input placeholder="Quantidades de litros" id="ipt_litros"><br><br>

    <h2>Danos em Câmaras</h2>
    <label for="ipt_afetados">Insira quantidade de doses afetadas</label>
    <input placeholder="Quantidade de doses afetadas" id="ipt_afetados"><br><br>

    <button onclick="vaxcontrol()">Calcular</button><br>
    <div id="div_mensagem"></div><br>
</body>

        let doses_afetadas = Number(ipt_afetados.value);
        div_mensagem.innerHTML = ``;

        let total_doses = vacinas * camara; // Quantidade total de doses.

        // Ocupação física.
        let espaco_litros = total_doses * 0.04;
        let percentual_ocupacao = (espaco_litros / litros) * 100

        // Gardasil 9 ocupa de 0,04 litros em média.

        let preco_bruto = (camara * vacinas) * valor_doses

        let patrimonio_bruto = total_doses * valor_doses;
        // Patrimônio financeiro armazenado nas câmaras.


        let valor_afetado = doses_afetadas * valor_doses;
        //Doses que foram afetadas por negligências ou que poderia causar

        if (doses_afetadas < 0 || doses_afetadas > total_doses) {
            alert("Erro! informe uma quantidade de doses afetadas entre 0 e o total armazenado.");
        }
        if (litros <= 0) {
            alert("Informe uma capacidade acima de 0 para a câmara.")
        }
        div_mensagem.innerHTML =
            `Relatorio Análitico da Câmara:<br>
        Atualmente, O preço líquido pago à MSD: R$${valor_doses.toFixed(2)} por dose.<br>
        Total de doses na Câmara: ${total_doses.toFixed(2)}.<br>
        Patrimônio Financeiro Armazenado R$${patrimonio_bruto.toFixed(2)}<br><br>
        Ocupação Física: ${espaco_litros.toFixed(2)} litros utilizados dos ${litros.toFixed(2)} litros totais (${percentual_ocupacao.toFixed(2)}% de ocupação)<br>
        <br>
        Relatório de Danos:<br>
        Doses Afetadas: ${doses_afetadas}<br>
        Valor original das doses afetadas R$${valor_afetado.toFixed(2)}<br>
        Doses preservadas: ${total_doses - doses_afetadas}<br>`
    }
