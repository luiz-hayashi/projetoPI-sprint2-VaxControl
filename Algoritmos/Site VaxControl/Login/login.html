<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../navbar-index.css">

    <!-- importa as fontes de texto externas  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
    <header>
        <nav class="navegador">
            <div class="topbar">
                <img class="logo" src="../imagens/logo.png" alt="Vaxcontrol logo">
                <span class="alinhar-texto-navbar">
                    <a class="links" href="../index.html">Home</a>
                    <a class="links" href="../CalculadoraFinanceira/inicio.html">Calculadora Financeira</a>
                    <a class="links" href="../index.html#contate">Fale Conosco</a>
                </span>
                <span class="alinhar-botao-navbar">
                    <button class="botao-topbar"
                        onclick="window.location.href='../Cadastro/cadastro.html'">Cadastrar</button>
                </span>
            </div>
        </nav>
    </header>
    <main>
        <div class="divPrincipal">
            <div class="divImagem">
                <img src="./imagens/imagemLogin.png" alt="" class="imgLogin">
            </div>
            <div class="divCaixa">
                <div class="divConteudo">
                    <p class="titulo">Faça login</p>
                    <div class="divFormularioLogin">
                        <div class="divInputs">
                            <label class="textoLabel" for="inputEmail">E-mail profissional:</label>
                            <input type="text" class="inputs" placeholder="Digite o seu email..." id="ipt_email">
                            <label class="textoLabel" for="inputSenha">Senha:</label>
                            <input class="inputs" type="password" id="ipt_senha" name="" class="inputSenha"
                                placeholder="Digite sua senha...">
                        </div>
                        <button class="botaoLogin" onclick="login()">FAZER LOGIN</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
<script>
    let tentativasLogar = 0;
    function login() {
        if (tentativasLogar != 2) {
            let email = ipt_email.value;
            let senha = ipt_senha.value;
            if (email == 'admin@gmail.com' && senha == '12345') {
                alert('Login efetuado com sucesso!');
                window.location.href = '../Dashboard/dashboard.html';
            }
            else {
                alert('Verifique se seu email ou sua senha está correta!');
                tentativasLogar++;
            }
        }
        else {
            alert("Login bloqueado! Por favor, tente fazer login novamente mais tarde.")
            window.location.href = '../index.html';

        }
    }


</script>
