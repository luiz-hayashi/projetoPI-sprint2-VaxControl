<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Vaxcontrol</title>

  <!-- pagina de estilização css  -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/camaras.css" />

  <!-- importa as fontes de texto externas  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <div class="container-body">
    <nav class="navegacao">

      <!-- obs: aqui sera colocado imagem da vaxcontrol  -->
      <img class="logo-img" src="dashboard-img/vaxcontrol-bg.png" alt="vaxcontrol logo">
      <p class="menu">MENU</p>

      <!-- O link <a> agora fica por fora, criando uma linha 100% clicável -->
      <a href="dashboard.html" class="item-menu">
        <img src="dashboard-img/dashboard.png" alt="icone de dashboard">
        <span>Dashboard</span>
      </a>

      <a href="camaras.html" class="item-menu">
        <img src="dashboard-img/camaras.png" alt="icone de camaras">
        <span>Câmaras</span>
      </a>

      <a href="sensores.html" class="item-menu">
        <img src="dashboard-img/sensores.png" alt="icone de sensores">
        <span>Sensores</span>
      </a>

      <a href="alertas.html" class="item-menu">
        <img src="dashboard-img/alerta.png" alt="icone de alertas">
        <span>Alertas</span>
      </a>

    </nav>
    <main>
      <!-- divisoria do nome do usuario e foto  -->
      <div class="box-user">
        <p class="user">Bem vindo(a) Usuario!</p>
        <span class="alinhar">
          <p>Usuario</p>
          <img class="user foto-perfil" src="dashboard-img/perfil.png" alt="foto de perfil do usuario">
        </span>
      </div>

      <!-- conteudo da pagina camaras  -->
      <div class="container">
        <div class="conteudo-camara-sensores">
          <div class="background">
            <div class="ordenar-titulos">
              <p>Câmaras</p>
              <p>Quantidade de sensores</p>
          </div>
        </div>
        <!-- caixa de selecioanr camaras e pesquisar  -->
        <div class="box-seletor-pesquisa">
          <!-- seletores de camara  --> 
          <button class="btn-filtrar-camaras" id="btn_ordenar_cam">Filtrar por A-Z 🡫</button>
          <!-- caixa de pesquisa  -->
          <input class="pesquisar-camaras" type="text" placeholder="Pesquisar 🔎">
        </div>
      </div>
        
      <div>
        <div class="dados-camaras">
          <!-- nomes das camaras  -->
        <ul>
          <li>2AB</li>
          <li>4</li>
          <button class="detalhes">Ver detalhes</button>
        </ul>
      </div>

      <div class="dados-sensores">
        <!-- quantidade de sensores  -->
        <ul>
          <li>7AD</li>
          <li>8</li>
          <button class="detalhes">Ver detalhes</button>
        </ul>
      </div>
    </div>
    </div>


    </main>
  </div>
</body>

</html>
