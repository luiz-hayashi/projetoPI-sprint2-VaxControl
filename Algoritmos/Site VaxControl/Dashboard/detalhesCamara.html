<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaxControl</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="./css/detalhesCamara.css">

    <!-- importação de fontes  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container-body">
        <nav class="navegacao">

            <!-- obs: aqui sera colocado imagem da vaxcontrol  -->
            <img class="logo-img" src="dashboard-img/vaxcontrol-bg.png" alt="vaxcontrol logo">
            <p class="menu">MENU</p>

            <!-- O link <a> agora fica por fora, criando uma linha 100% clicável -->
            <a href="dashboard.html" class="item-menu">
                <img src="dashboard-img/dashboard.png" alt="icone de dashboard">
                <span>Dashboard</span>
            </a>

            <a href="camaras.html" class="item-menu">
                <img src="dashboard-img/camaras.png" alt="icone de camaras">
                <span>Câmaras</span>
            </a>

            <a href="sensores.html" class="item-menu">
                <img src="dashboard-img/sensores.png" alt="icone de sensores">
                <span>Sensores</span>
            </a>

            <a href="alertas.html" class="item-menu">
                <img src="dashboard-img/alerta.png" alt="icone de alertas">
                <span>Alertas</span>
            </a>

            <a class="item-menu opcao-sair" href="../index.html">
                <img src="dashboard-img/sair.png" alt="icone de sair">
                <span>Sair</span>
            </a>
        </nav>
        <main>
            <div class="area-principal">

                <div class="usuario">

                    <span>Admin</span>
                    <img src="dashboard-img/perfil.png" alt="">

                </div>

                <div class="cabecalho">

                    <button class="botao-voltar" onclick="window.location.href = 'camaras.html';"><b>←
                            Voltar<b></button>
                    <h1>Câmara A</h1>


                </div>
            </div>



            <div class="indicadores">

                <div class="card">

                    <p>Quantidade de sensores</p>
                    <h2>4</h2>

                </div>

                <div class="card">

                    <p>Sensores Ativos</p>
                    <h2>3</h2>

                </div>

                <div class="card">

                    <p>Sensores Inativos</p>
                    <h2>1</h2>

                </div>

            </div>

            <div class="conteudo-inferior">

                <div class="tabela-sensores">

                    <h2>Sensores</h2>

                    <table>

                        <thead>

                            <tr>

                                <th>Identificação</th>
                                <th>Leitura</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr>

                                <td>Sensor01A</td>
                                <td class="sensor-alerta">1ºC</td>

                            </tr>
                            <tr>

                                <td>Sensor02A</td>
                                <td class="sensor-alerta">10ºC</td>
                                
                            </tr>
                            <tr>

                                <td>Sensor03A</td>
                                <td>4,6ºC</td>
                                
                            </tr>
                            <tr>

                                <td>Sensor04A</td>
                                <td class="sensor-inativo">Inativo</td>

                            </tr>

                        </tbody>

                    </table>

                </div>

                <div class="grafico">

                    <h2>Gráfico de monitoramento</h2>

                    <canvas id="graficoTemperatura"></canvas>

                </div>

            </div>
        </main>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const canvas = document.getElementById('graficoTemperatura');

    const grafico = new Chart(canvas, {
        type: 'line',
        data: {

            labels: ['12:30', '12:35', '12:40', '12:45'],
            datasets: [{
                label: 'Sensor01A',
                data: [5, 5.2, 4.8, 1],
                borderColor: 'blue',
                tension: 0.3,
            },

            {
                label: 'Sensor02A',
                data: [3.8, 4.1, 4.0, 8.0],
                borderColor: 'purple',
                tension: 0.3,
            },
            {
                label: 'Sensor03A',
                data: [4.5, 4.7, 4.3, 4.6],
                borderColor: 'green',
                tension: 0.3,

            },
            {
                label: 'Sensor04A',
                data: [null, null, null, null],
                borderColor: 'gray',
                spanGaps: false 
            },

            ]
        },

        options: {
            maintainAspectRatio: false,
            scales: {
                y: {
                    min: 0,
                    max: 10
                }
            },

        }
    }
    );
</script>
<script>
</script>

</html>
