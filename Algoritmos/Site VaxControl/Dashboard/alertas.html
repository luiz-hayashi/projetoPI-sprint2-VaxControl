<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Vaxcontrol</title>

  <!-- pagina de estilização css  -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/alertas.css" />

  <!-- importa as fontes de texto externas  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <div class="container-body">
    <nav class="navegacao">

      <!-- obs: aqui sera colocado imagem da vaxcontrol  -->
      <img class="logo-img" src="dashboard-img/vaxcontrol-bg.png" alt="vaxcontrol logo">
      <p class="menu">MENU</p>

      <!-- O link <a> agora fica por fora, criando uma linha 100% clicável -->
      <a href="dashboard.html" class="item-menu">
        <img src="dashboard-img/dashboard.png" alt="icone de dashboard">
        <span>Dashboard</span>
      </a>

      <a href="camaras.html" class="item-menu">
        <img src="dashboard-img/camaras.png" alt="icone de camaras">
        <span>Câmaras</span>
      </a>

      <a href="sensores.html" class="item-menu">
        <img src="dashboard-img/sensores.png" alt="icone de sensores">
        <span>Sensores</span>
      </a>

      <a href="alertas.html" class="item-menu">
        <img src="dashboard-img/alerta.png" alt="icone de alertas">
        <span>Alertas</span>
      </a>

      <a class="item-menu opcao-sair" href="../index.html">
        <img src="dashboard-img/sair.png" alt="icone de sair">
        <span>Sair</span>
      </a>
    </nav>
    <main>

      <main>
        <h1>Histórico de Alertas</h1>

        <div class="filtros">
          <select id="camara">
            <option value="Todas">Câmara</option>
            <option value="2AB">2AB</option>
            <option value="3DC">3DC</option>
          </select>

          <select id="horario">
            <option value="24">24 Horas</option>
            <option value="12">12 Horas</option>
          </select>
        </div>

        <div id="mensagem"></div>
      </main>

    </main>

    <script>
      // Função que mostra os alertas
      function mostrarAlertas() {

        // Pega a câmara escolhida no select
        let camara = document.getElementById("camara").value;

        // Pega a div onde os alertas serão mostrados
        let mensagem = document.getElementById("mensagem");

        // Se escolher todas as câmaras, mostra os dois alertas
        if (camara == "Todas") {

          mensagem.innerHTML = `
          <table>
 <tr>
    <th>Temperatura</th>
    <th>Câmara</th>
    <th>Sensor</th>
    <th>Data</th>
    <th>Horário</th>
    <th>Descrição</th>
  </tr>

  <tr>
    <td>1 °C</td>
    <td>2AB</td>
    <td>Sensor01AB</td>
    <td>10/10/2026</td>
    <td>12:45</td>
    <td>Temperatura abaixo da margem segura</td>
    </tr>
    
    <tr>
      <td>9.5 °C</td>
      <td>3DC</td>
      <td>Sensor02DC</td>
      <td>10/10/2026</td>
      <td>12:40</td>
      <td>Temperatura acima da margem segura</td>
      </tr>
      
      <tr>
        <td>Inativo</td>
        <td>2AB</td>
        <td>Sensor04AB</td>
        <td>10/10/2026</td>
        <td>12:38</td>
        <td>Sensor mudou para status "Inativo"</td>
      </tr>
      <tr>
        <td>1 °C</td>
        <td>4VX</td>
        <td>Sensor01VX</td>
    <td>10/10/2026</td>
    <td>12:35</td>
    <td>Temperatura abaixo da margem segura</td>
  </tr>

  <tr>
    <td>9 °C</td>
    <td>1FG</td>
    <td>Sensor01FG</td>
    <td>10/10/2026</td>
    <td>12:30</td>
    <td>Temperatura acima da margem segura</td>
  </tr>

  <tr>
    <td>9 °C</td>
    <td>3DC</td>
    <td>Sensor01DC</td>
    <td>10/10/2026</td>
    <td>12:30</td>
    <td>Temperatura acima da margem segura</td>
  </tr>
            </table>
        `;

          // Se escolher a câmara 2AB, mostra somente seu alerta
        } else if (camara == "2AB") {

          mensagem.innerHTML = `
          <table>
            <tr>
              <th>Temperatura</th>
              <th>Câmara</th>
              <th>Sensor</th>
              <th>Data</th>
              <th>Horário</th>
              <th>Descrição</th>
            </tr>

            <tr>
              <td>1 °C</td>
              <td>2AB</td>
              <td>Sensor1</td>
              <td>10/10/2026</td>
              <td>12:45</td>
              <td>Sensor mudou para status inativo</td>
            </tr>
          </table>
        `;

          // Se escolher a câmara 3DC, mostra somente seu alerta
        } else if (camara == "3DC") {

          mensagem.innerHTML = `
          <table>
            <tr>
              <th>Temperatura</th>
              <th>Câmara</th>
              <th>Sensor</th>
              <th>Data</th>
              <th>Horário</th>
              <th>Descrição</th>
            </tr>

            <tr>
              <td>10 °C</td>
              <td>3DC</td>
              <td>Sensor2</td>
              <td>10/10/2026</td>
              <td>01:20</td>
              <td>Acima da margem segura</td>
            </tr>
          </table>
        `;
        }
      }

      // Executa a função quando a câmara for alterada
      document.getElementById("camara").onchange = mostrarAlertas;

      // Mostra os alertas assim que a página abrir
      mostrarAlertas();
    </script>

</body>

</html>

</main>

</html>
