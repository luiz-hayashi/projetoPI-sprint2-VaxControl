<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="styleCadastro.css">
</head>

<body>
    <div class="divPrincipal">
        <div class="divImagem">
            <img src="./imagens/imgCadastro.png" alt="" class="imgCadastro">
        </div>
        <div class="divCaixa">
            <div class="divConteudo">
                <p class="titulo">Cadastre-se</p>
                <div class="divFormularioCadastro">
                    <div class="divInputs">
                        <label class="textoLabel" for="inputEmail">Nome completo:</label>
                        <input type="text" class="inputs" placeholder="Digite o seu nome...">
                        <label class="textoLabel" for="inputEmail">E-mail profissional:</label>
                        <input type="text" class="inputs" placeholder="Digite o seu email...">
                        <label class="textoLabel" for="inputSenha">Senha:</label>
                        <input class="inputs" type="password" name="" class="inputSenha"
                            placeholder="Digite sua senha...">
                        <label class="textoLabel" for="inputSenha">Nome da empresa:</label>
                        <input class="inputs" type="password" name="" class="inputSenha"
                            placeholder="Digite sua senha...">
                    </div>
                    <button class="botaoCadastro">FAZER CADASTRO</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
