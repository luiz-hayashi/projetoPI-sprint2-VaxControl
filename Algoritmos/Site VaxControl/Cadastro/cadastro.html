<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="../navbar-index.css">

    <!-- importa as fontes de texto externas  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<header>
    <nav class="navegador">
        <div class="topbar">
            <img class="logo" src="../imagens/logo.png" alt="Vaxcontrol logo">
            <span class="alinhar-texto-navbar">
                <a class="links" href="../sobre.html">Quem nós somos</a>
                <a class="links" href="../CalculadoraFinanceira/inicio.html">Calculadora Financeira</a>
                <a class="links" href="../Login/login.html">Dashboard</a>
                <a class="links" href="../contato.html">Fale Conosco</a>
            </span>
            <!-- <button class="botao-topbar">Cadastre-se</button> -->
            <span class="alinhar-botao-navbar">
                <button class="botao-topbar" onclick="window.location.href='../Login/login.html'">Entrar</button>
            </span>
        </div>
    </nav>
</header>
<body>
    <div class="divPrincipal">
        <div class="divImagem">
            <img src="./imagens/imgCadastro.png" alt="" class="imgCadastro">
        </div>
        <div class="divCaixa">
            <div class="divConteudo">
                <p class="titulo">Cadastre-se</p>
                <div class="divFormularioCadastro">
                    <div class="divInputs">
                        <label class="textoLabel" for="inputEmail">Nome completo:</label>
                        <input type="text" class="inputs" placeholder="Digite o seu nome...">
                        <label class="textoLabel" for="inputEmail">E-mail profissional:</label>
                        <input type="text" class="inputs" placeholder="Digite o seu email...">
                        <label class="textoLabel" for="inputSenha">Senha:</label>
                        <input class="inputs" type="password" name="" class="inputSenha"
                            placeholder="Digite sua senha...">
                        <label class="textoLabel" for="inputSenha">Nome da empresa:</label>
                        <input class="inputs" type="password" name="" class="inputSenha"
                            placeholder="Digite sua senha...">
                    </div>
                    <button class="botaoCadastro">FAZER CADASTRO</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
