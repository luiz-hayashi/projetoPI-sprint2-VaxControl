<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    // Em hospitais, laboratórios e etc... é mais comum 1 câmara quebrar
    // de uma vez, então é mais proveitoso ele fazer os
    // calculos do valor trancado dessa câmara. Pensando nisso, pensei melhor
    // em criar uma calculadora para que o cliente possa inserir os dados
    // dos prejuízos em casos de quebras, problemas, falta de energia e etc.
    // E essas quebras serão alertadas e mostradas na Dashboard.
</script>

<body>
    <h1>Calculadora Financeira de Câmaras</h1>
    <h1>VaxControl</h1>

    <h2>Dados Financeiros</h2>

    <label for="ipt_doses">Insira o valor das doses:</label>
    <input placeholder="Valor das doses" id="ipt_doses"><br>
    <label for="ipt_desconto">Você faz parte do programa "Receita de Vida"</label>
    <select name="Receita_de_Vida" id="ipt_desconto">
        <option value=""> </option>
        <option value="Sim">Sim</option>
        <option value="Nao">Não</option>
    </select>

    <h2>Dados Produto</h2>

    <label for="ipt_vacinas">Insira quantidade de vacinas por lote:</label>
    <input placeholder="Quantidades de vacinas p/lote" id="ipt_vacinas"><br>
    <label for="ipt_camara">Insira quantidade de lotes mantidos por câmara:</label>
    <input placeholder="Quantidades de lotes mantidos" id="ipt_camara"><br>

    <h2>Dados de Estrutura</h2>

    <label for="ipt_litros">Insira quantidade de litros por câmara em m³:</label>
    <input placeholder="Quantidades de litros" id="ipt_litros"><br><br>

    <button onclick="vaxcontrol()">Calcular</button><br>
    <div id="div_mensagem"></div><br>
</body>

</html>

<script>
    function vaxcontrol() {
        let valor_doses = Number(ipt_doses.value);
        // Alem que a MSD ela tem um programa chamado "Receita de Vida" que concede
        // um valor fixo de 50 reais por dose.

        let desconto = 0;

        if (ipt_desconto.value === 'Sim') {
            desconto = 50;
        }

        let vacinas = Number(ipt_vacinas.value); // Quantidade de vacinas por lote
        // para o cliente saber quantas doses de cada lote está sob refrigeração.

        let camara = Number(ipt_camara.value); // Mostra os produtos dentro da câmara.
        // em lotes.

        let litros = Number(ipt_litros.value); // Diz o tamanho disponível dentro
        // da câmara, o cliente sabe o limite físico.
        div_mensagem.innerHTML = ``;

        let total_doses = vacinas * camara; // Quantidade total de doses.

        // Ocupação física.
        let espaco_litros = total_doses * 0.04;
        let percentual_ocupacao = (espaco_litros / litros) * 100
        // Considerando o padrão de mercado de uma caixa com 10 doses de
        // Gardasil 9 ocupa de 0,4 litros em média.

        let preco_bruto = (camara * vacinas) * valor_doses
        let preco_liquido_descontado = valor_doses - desconto;
        // Custo real do valor gasto nas doses.

        let economia_total = total_doses * desconto;

        let patrimonio_bruto = total_doses * valor_doses;
        // Patrimônio financeiro armazenado nas câmaras.

        let patrimonio_liquido = total_doses * preco_liquido_descontado;

        div_mensagem.innerHTML =
            `Relatorio Análitico da Câmara<br>
        Atualmente, O preço líquido pago à MSD: R$${preco_liquido_descontado.toFixed(2)} por dose.<br>
        Total de Vacinas na Câmara: ${total_doses.toFixed(2)}.<br>
        Economia Gerada pelo Desconto: R$${economia_total.toFixed(2)}<br>
        Patrimônio Financeiro Armazenado R$${patrimonio_liquido.toFixed(2)}<br>        Ocupação Física: ${espaco_litros.toFixed(2)} utilizados dos ${litros.toFixed(2)} litros totais (${percentual_ocupacao.toFixed(2)}% de ocupação)<br>`
    }

        if (ipt_desconto.value === 'Nao') {
            desconto = 0;
        }

        div_mensagem.innerHTML =
            `Relatorio Análitico da Câmara<br>
        Atualmente, O preço líquido pago à MSD: R$${patrimonio_bruto.toFixed(2)} por dose.<br>
        Total de Vacinas na Câmara: ${total_doses.toFixed(2)}.<br>
        Economia Gerada pelo Desconto: R$00.00<br>
        Patrimônio Financeiro Armazenado R$${patrimonio_liquido.toFixed(2)}<br>
        Ocupação Física: ${espaco_litros.toFixed(2)} utilizados dos ${litros.toFixed(2)} litros totais (${percentual_ocupacao.toFixed(2)}% de ocupação)<br>`
</script>
