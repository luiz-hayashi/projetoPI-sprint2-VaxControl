<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora fincanceira VaxControl</title>
    <link rel="stylesheet" href="calculadora.css">
    <link rel="stylesheet" href="../navbar-index.css">
    <!-- importa as fontes de texto externas  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body class="fundo">
    <header>
        <nav class="navegador">
            <div class="topbar">
                <img class="logo" src="../imagens/logo.png" alt="Vaxcontrol logo">
                <span class="alinhar-texto-navbar">
                    <a class="links" href="../sobre.html">Quem nós somos</a>
                    <a class="links" href="../CalculadoraFinanceira/inicio.html">Calculadora Financeira</a>
                    <a class="links" href="../Login/login.html">Dashboard</a>
                    <a class="links" href="../contato.html">Fale Conosco</a>
                </span>
                <!-- <button class="botao-topbar">Cadastre-se</button> -->
                <span class="alinhar-botao-navbar">
                    <button class="botao-topbar" onclick="window.location.href='../Login/cadastro.html'">Cadastrar</button>
                    <button class="botao-topbar" onclick="window.location.href='../Login/login.html'">Entrar</button>
                </span>
            </div>
        </nav>
    </header>
    <main class="conteudo-principal">

        <h1 class="titulo">Calculadora Financeira VaxControl</h1>
        <div class="div_textos">
            <label for="ipt_valorDose">Insira o valor de cada dose:</label>
            <input class="input" type="text" id="ipt_valorDose" value="925">
            <br><br>
            <label for="ipt_qtdDoses">Insira a quantidade de doses armazenadas por lote:</label>
            <input class="input" type="text" id="ipt_qtdDoses" value="100">
            <br><br>
            <label for="ipt_qtdLote">Insira a quantidade de lotes mantidos simultaneamente na câmara fria:</label>
            <input class="input" type="text" id="ipt_qtdLote" value="3">
            <br>
        </div>

        <br>

        <div class="container">
            <button class="button" onclick="calcular()">Simular Valores</button>
        </div>

        <br>

        <div class="msg" id="div_msg"></div>
        <div class="container">
            <a href="inicio.html">
                <button class="button">Como funciona?</button>
            </a>
        </div>
    </main>
</body>

</html>

<script>

    function calcular() {

        let quantidade_vacina = Number(ipt_qtdDoses.value);
        let quantidade_lotes = Number(ipt_qtdLote.value);
        let valor_dose = Number(ipt_valorDose.value);

        let qntd_total = quantidade_vacina * quantidade_lotes;

        let valor_perdido = Number(qntd_total * valor_dose);

        div_msg.innerHTML =
            `Isso representa um prejuízo invisível de <b>R$${valor_perdido.toFixed(2)}</b> em seu estoque. <br>
         Ao implementar nossa solução de monitoramento contínuo, este é o valor estimado que sua operação deixará de perder, transformando risco em receita garantida.`;

    }
</script>
