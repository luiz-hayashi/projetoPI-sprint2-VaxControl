<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styleLogin.css">
</head>

<body>
    <div class="divPrincipal">
        <div class="divImagem">
            <img src="./imagens/imagemLogin.png" alt="" class="imgLogin">
        </div>
        <div class="divCaixa">
            <div class="divConteudo">
                <p class="titulo">Faça login</p>
                <div class="divFormularioLogin">
                    <div class="divInputs">
                        <label class="textoLabel" for="inputEmail">E-mail profissional:</label>
                        <input type="text" class="inputs" placeholder="Digite o seu email...">
                        <label class="textoLabel" for="inputSenha">Senha:</label>
                        <input class="inputs" type="text" name="" class="inputSenha" placeholder="Digite sua senha...">
                    </div>
                    <button class="botaoLogin">FAZER LOGIN</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
