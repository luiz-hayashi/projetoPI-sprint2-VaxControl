<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="./css/navbar-index.css">

    <!-- importa as fontes de texto externas  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
    <header>
        <nav class="navegador">
            <div class="topbar">
                <img class="logo" src="imagens/logo.png" alt="Vaxcontrol logo">
                <span class="alinhar-texto-navbar">
                    <a class="links" href="index.html">Home</a>
                    <a class="links" href="./calculadora-financeira.html">Calculadora Financeira</a>
                    <a class="links" href="index.html#contate">Fale Conosco</a>
                </span>
                <!-- <button class="botao-topbar">Cadastre-se</button> -->
                <span class="alinhar-botao-navbar">
                    <button class="botao-topbar" onclick="window.location.href='cadastro.html'">Cadastrar</button>
                    <button class="botao-topbar" onclick="window.location.href='login.html'">Entrar</button>
                </span>
            </div>
        </nav>
    </header>
    <main>
        <div class="divPrincipal">
            <div class="divImagem">
                <img src="./imagens/imagemLogin.png" alt="" class="imgLogin">
            </div>
            <div class="divCaixa">
                <div class="divConteudo">
                    <p class="titulo">Faça login</p>
                    <div class="divFormularioLogin">
                        <div class="divInputs">
                            <label class="textoLabel" for="ipt_Email">E-mail profissional:</label>
                            <input type="text" class="inputs" placeholder="Digite o seu email..." id="ipt_email">
                            <label class="textoLabel" for="ipt_senha">Senha:</label>
                            <input class="inputs" type="password" id="ipt_senha" name="" class="inputSenha"
                                placeholder="Digite sua senha...">
                        </div>
                        <button class="botaoLogin" onclick="login()">FAZER LOGIN</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
<script>
    // IDEIA: tentativas ser um cooldown de 1 minuto caso seja bloqueado

    function verificarLogin() {
        let tentativasLogar = 0;

        var emailVar = ipt_email.value;
        var senhaVar = ipt_senha.value;

        if (tentativasLogar != 2) {

            if (emailVar == "") {
                mensagemCard('O campo de email está vazio!');
            }
            else if (senhaVar == "") {
                mensagemCard('O campo de senha está vazio!');
            }
            else if (!emailVar.includes('.com').includes('@')) {
                mensagemCard('O email não consta "@" e ".com"');
            }
            else if ((emailVar.indexOf('.com')) < (email.indexOf('@'))) {
                mensagemCard('O caractere "@" está alocado antes do ".com"');
            }
            else {
                mensagemCard('Login efetuado com sucesso!');
                entrar();
                finalizarAguardar();
                return false;
            }
        }
        else {
            mensagemCard("Login bloqueado! Por favor, tente fazer login novamente mais tarde.")
            setInterval(sumirMensagem, 5000)
            // window.location.href = '../index.html';
        }
        tentativasLogar++;
    }

    function mensagemCard(msg) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = msg;
    }


    function entrar() {
        aguardar();

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    // sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    setTimeout(function () {
                        window.location.href = './dashboard/dashboard.html';
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    // modal de aviso
    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
